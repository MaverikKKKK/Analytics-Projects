name: ButlerAI
options:
  bundleIdPrefix: com.butlerai
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only

targets:
  ButlerAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ButlerAI
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.butlerai.app
        PRODUCT_NAME: Butler.AI
        INFOPLIST_FILE: ButlerAI/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ButlerAI/Resources/ButlerAI.entitlements
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: ButlerAI/Resources/Info.plist
      properties:
        CFBundleName: Butler.AI
        CFBundleDisplayName: Butler.AI
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.butlerai.app.refresh
          - com.butlerai.app.process
        NSUserNotificationUsageDescription: "Butler.AI monitors your notifications to capture tasks from Slack, Email, WhatsApp, and SMS."
        NSFaceIDUsageDescription: "Butler.AI uses Face ID to securely unlock your data."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - butlerai
          # Add your Google OAuth reverse client ID here for Gmail
          # - CFBundleURLSchemes:
          #     - com.googleusercontent.apps.YOUR_CLIENT_ID
    entitlements:
      path: ButlerAI/Resources/ButlerAI.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.com.butlerai.app
