name: ButlerAI
options:
  bundleIdPrefix: com.butlerai
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ButlerAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ButlerAI
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.butlerai.app
        PRODUCT_NAME: Butler.AI
        INFOPLIST_FILE: ButlerAI/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
